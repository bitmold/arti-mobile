# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
android.builtInKotlin=true
android.dependency.useConstraints=true
android.enableJetifier=false
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
android.newDsl=true
android.uniquePackageNames=false
android.useAndroidX=true
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.max-problems=0
org.gradle.configureondemand=true
org.gradle.console=colored
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.workers.max=8


LIBRARY_GROUP = org.torproject
LIBRARY_ARTIFACT_ID = arti-mobile
LIBRARY_VERSION_NAME = 1.7.0.1
LIBRARY_URL = "https://gitlab.com/guardianproject/tormobile/arti-mobile"
LIBRARY_GIT_URL = "https://gitlab.com/guardianproject/tormobile/arti-mobile.git"
OSS_SIGNING_KEY_ID = "nathan@guardianproject.info"
